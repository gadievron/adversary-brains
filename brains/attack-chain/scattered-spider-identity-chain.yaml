# Scattered Spider, where the signature is off-telemetry (appendix 2 of the
# brief). The load-bearing entry step is a phone call to a help desk to reset
# MFA — not in any telemetry a brain ingests — so in most environments its
# link is marked invisible by the local coverage map and the brain SUSPENDS
# for want of visibility, not because the actor is absent. The observable
# scaffold is routine steps distinctive only in arrangement: register a new
# MFA device, federate a new identity provider with automatic account
# linking, delete conditional-access policies.
# Divergences from the printed fragment (see docs/DIVERGENCES.md):
# D4 — the help-desk reset is added as link L0 (required). The appendix prose
#   demands it ("its link carries observability: invisible and the brain
#   suspends") but the printed YAML fragment omits it; without L0 the
#   suspension semantics cannot be exercised.
# D9 — the fragment's e2 pattern entry `auto-link on` is not parseable into a
#   schema-valid pattern map (PyYAML reads it as key "auto-link on" = null);
#   repaired here as the namespaced annotation `x-auto-link: "on"`.
# Observability itself is LOCAL and never appears in this file; the demo
# environment's coverage map will live at experiments/coverage.yaml (Stage 4).
