# Volt Typhoon, an actor built to be featureless (appendix 2 of the brief).
# Living off the land, most of what it does is commodity by design; two native
# actions survive the wager: the netsh PortProxy registry change that turns a
# compromised host into a relay, and ntdsutil writing a copy of the directory
# database to a readable location. Both are close to the operation rather
# than to a swappable tool, so both are required and stable. The router-botnet
# relays are infrastructure — disrupted in early 2024 and rebuilt — so those
# entities would be ephemeral and are not represented here.
