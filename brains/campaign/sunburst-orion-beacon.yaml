# SUNBURST, where the strong link is structural (appendix 2 of the brief):
# the signed Orion monitoring process itself makes the outbound call. That is
# not a tool choice the operator can swap without giving up the operation, so
# the link is required and stable, and it is observable on the host. The DGA
# domain (a subdomain of avsvmcloud.com) was sinkholed within days, so the
# destination entity carries no concrete value and any concrete indicator
# would be ephemeral.
# Divergence from the printed fragment (D3): e2's "non-solarwinds-destination"
# x-note is kept, and a machine-checkable constraint `value|not-contains:
# solarwinds` is added so a matcher can enforce it rather than read it.
